# ---------------------------------------------------------------------------
# Push to main -> test -> build -> smoke test -> publish to Docker Hub.
#
# Two jobs, and the split matters: `publish` declares `needs: test`, so a
# failing suite means no image is pushed. A registry that always has an image
# is not the goal; a registry whose `latest` is always one that passed is.
#
# Required repository secrets (Settings -> Secrets and variables -> Actions):
#
#   DOCKERHUB_USERNAME   your Docker Hub username
#   DOCKERHUB_TOKEN      an access token, NOT your password
#                        https://hub.docker.com/settings/security
#
# No Groq key is needed. Every test is offline, and the image never contains
# a key - it arrives at run time via --env-file.
# ---------------------------------------------------------------------------

name: Publish image

on:
  push:
    branches: [main]
    tags: ["v*"]
    # Documentation-only commits do not change the image.
    paths-ignore:
      - "**.md"
      - "docs/**"
      - ".gitignore"
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  IMAGE: nnarkhede/portfolio-chatbot

# A newer push makes an in-flight build irrelevant. Cancel it rather than
# paying for a run whose result is already superseded.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:

  # -------------------------------------------------------------------
  test:
    name: Tests
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt

      - name: Lint
        run: ruff check .

      - name: Tests
        # The whole suite is offline: no API key, no model download, no
        # network. That is what makes it usable as a merge gate at all.
        run: python -m pytest -q

  # -------------------------------------------------------------------
  publish:
    name: Build and publish
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 45

    # Never on a pull request. Fork PRs cannot read secrets, so the login
    # would fail, and a PR should not be able to overwrite `latest` anyway.
    if: github.event_name != 'pull_request'

    steps:
      - uses: actions/checkout@v5

      - name: Free disk space
        # The runner ships ~14 GB free. This image installs torch, which is
        # several GB on its own, so a default runner can die with "no space
        # left on device" partway through pip. These directories are not used
        # by this build.
        run: |
          df -h /
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
                      /usr/local/share/boost "$AGENT_TOOLSDIRECTORY" || true
          df -h /

      - uses: docker/setup-buildx-action@v3

      - name: Compute the run fingerprint
        # The image is labelled with the config fingerprint it was built from,
        # so a running container can be traced back to an exact configuration.
        # Losing that here would mean every CI image is labelled "unknown".
        id: fingerprint
        run: |
          python -m pip install --quiet pydantic
          FP=$(PYTHONPATH=src python -c \
            "from portfolio_chatbot.config import load_config; print(load_config().run_fingerprint)")
          echo "value=$FP" >> "$GITHUB_OUTPUT"
          echo "run_fingerprint = $FP"

      - name: Tags
        id: meta
        # `latest` plus the commit SHA. The SHA tag is the one that matters
        # when something breaks: `latest` has already moved on by then, and
        # "which image was running" stops being answerable without it.
        run: |
          SHA="${GITHUB_SHA::7}"
          TAGS="${IMAGE}:latest,${IMAGE}:${SHA}"
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            TAGS="${TAGS},${IMAGE}:${GITHUB_REF#refs/tags/}"
          fi
          echo "tags=$TAGS" >> "$GITHUB_OUTPUT"
          echo "sha=$SHA"   >> "$GITHUB_OUTPUT"
          echo "$TAGS"

      - name: Build
        uses: docker/build-push-action@v6
        with:
          context: .
          # Built and LOADED, not pushed. The smoke test below runs against
          # this exact image, and only then is it published - so a container
          # that cannot start never reaches Docker Hub.
          load: true
          push: false
          tags: ${{ steps.meta.outputs.tags }}
          build-args: |
            RUN_FINGERPRINT=${{ steps.fingerprint.outputs.value }}
            BUILT_AT=${{ github.event.head_commit.timestamp || github.run_id }}
          # Layer cache keyed by the workflow. The torch install is the
          # expensive layer and it only changes when requirements.txt does.
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke test
        # Does it actually serve? This is the check that would have caught
        # every container problem this project has hit: an entrypoint that
        # exits, a permission error on the HuggingFace cache, an index that
        # was never built. A green build says the layers assembled, which is
        # not the same claim.
        run: |
          docker run -d --name smoke -p 8501:8501 \
            -e GROQ_API_KEY=not-a-real-key \
            "${IMAGE}:${{ steps.meta.outputs.sha }}"

          for i in $(seq 1 60); do
            if curl -fsS http://localhost:8501/_stcore/health | grep -q ok; then
              echo "healthy after ${i}s"
              docker rm -f smoke
              exit 0
            fi
            if [ -z "$(docker ps -q -f name=smoke)" ]; then
              echo "::error::the container exited before becoming healthy"
              docker logs smoke
              exit 1
            fi
            sleep 1
          done

          echo "::error::no healthy response after 60s"
          docker logs smoke
          exit 1

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Push
        run: |
          IFS=',' read -ra TAGS <<< "${{ steps.meta.outputs.tags }}"
          for tag in "${TAGS[@]}"; do
            echo "pushing $tag"
            docker push "$tag"
          done

      - name: Summary
        run: |
          {
            echo "### Published"
            echo
            echo '```'
            echo "docker pull ${IMAGE}:${{ steps.meta.outputs.sha }}"
            echo '```'
            echo
            echo "| | |"
            echo "|---|---|"
            echo "| commit | \`${{ steps.meta.outputs.sha }}\` |"
            echo "| run_fingerprint | \`${{ steps.fingerprint.outputs.value }}\` |"
          } >> "$GITHUB_STEP_SUMMARY"
