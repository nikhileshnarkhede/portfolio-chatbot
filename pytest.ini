[pytest]
# ONLY `src` here - deliberately NOT `.`.
#
# `streamlit run ui/app.py` puts ui/ on sys.path, not the project root. Adding
# `.` here would make `ui.components` importable under pytest but not under
# streamlit, which is exactly how a "No module named 'ui'" crash shipped once
# with a green test suite. ui/app.py bootstraps its own paths; the tests must
# exercise that, not paper over it.
pythonpath = src
testpaths = tests
addopts = -q --strict-markers
markers =
    ui: boots a real Streamlit script run (slow). Deselect with -m "not ui".
